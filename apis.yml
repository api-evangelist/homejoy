name: HomeJoy
description: >-
  Homejoy, Inc. was an online home-services marketplace that connected customers with
  vetted house cleaners and handymen through its website and mobile apps. Founded in 2010
  by siblings Adora and Aaron Cheung, the Y Combinator-backed company raised roughly
  $40M (Google Ventures, Redpoint, First Round, Max Levchin) and expanded to more than
  30 cities across the US, UK, Canada, France and Germany. Battered by high customer
  churn, discount-driven growth and worker-misclassification lawsuits, Homejoy ceased
  operations on July 31, 2015; much of its product and engineering team was acqui-hired
  by Google. This is an archival API Evangelist profile of a defunct company: it operates
  no public API, developer portal, or SDKs, and its former homejoy.com domain now
  redirects to an unrelated cleaning service.
